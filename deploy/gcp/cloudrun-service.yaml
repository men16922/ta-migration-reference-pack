apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ta-migration-lab
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale-to-zero: $0 idle cost, no always-on VM
        autoscaling.knative.dev/minScale: "0"
        # Hard cap on max instances to prevent unexpected billing spikes
        autoscaling.knative.dev/maxScale: "2"
        # Request-based billing: CPU is only billed while serving HTTP requests
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/ta-migration-lab/web:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "128Mi"
