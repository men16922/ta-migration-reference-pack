[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onprem-atlas"
version = "0.1.0"
description = "On-prem asset inventory (ESM xlsx -> SQLite) for project-scoped draw.io diagrams and AWS migration sizing input"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "ruff>=0.6,<1", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[project.scripts]
onprem-atlas = "onprem_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/onprem_atlas/synth.py" = ["S311"]
